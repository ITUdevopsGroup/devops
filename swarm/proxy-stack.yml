services:
  traefik:
    image: traefik:v3.6
    command:
      - "--api.insercure=true"
      - "--providers.docker=true"
      - "--entrypoints.api.address=:6001"
    ports:
      - "6001:6001"
      - "8080:8080"
    deploy:
      placement:
        constraints:
        - node.hostname == MiniTwit-Database
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro   # Swarm API socket

networks:
  name: minitwit-public 
  driver: overlay
