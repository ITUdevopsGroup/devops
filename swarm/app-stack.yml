version: "3.8"

services:
  backend:
    depends_on:
      - db
    image: andersfrimann/devops_backend:main
    networks:
      - minitwit-public
      - backend-db
    environment:
      MINITWIT_DB_URL: jdbc:postgresql://db:5432/minitwit
      MINITWIT_DB_USER: minitwit_user
      MINITWIT_DB_PASSWORD: minitwit_password
    deploy:
      replicas: 3
      placement:
        max_replicas_per_node: 2
      labels:
        - traefik.enable=true

        # Router 1: HTTPS — https://rollbackandrelax.dk/api/*
        - traefik.http.routers.backend.rule=Host(`api.rollbackandrelax.dk`)
        - traefik.http.routers.backend.entrypoints=websecure
        - traefik.http.routers.backend.tls.certresolver=letsencrypt

        # Router for backend API
        - traefik.http.services.backend.loadbalancer.server.port=5001

  frontend:
    image: andersfrimann/devops_frontend:main
    networks:
      - minitwit-public
    environment:
      NEXT_PUBLIC_API_HOST: https://rollbackandrelax.dk/api
      NEXT_PUBLIC_API_PORT: "443"
    deploy:
      labels:
        - traefik.enable=true
        # Catch-all for non-API traffic → frontend
        - traefik.http.routers.frontend.rule=Host(`rollbackandrelax.dk`)
        - traefik.http.routers.frontend.entrypoints=websecure
        - traefik.http.routers.frontend.tls.certresolver=letsencrypt
        - traefik.http.services.frontend.loadbalancer.server.port=3000

  db:
    image: postgres:16
    restart: unless-stopped
    networks:
      - backend-db
    environment:
      POSTGRES_DB: minitwit
      POSTGRES_USER: minitwit_user
      POSTGRES_PASSWORD: minitwit_password
    volumes:
      - db_data_prod:/var/lib/postgresql/data
    deploy:
      placement:
        constraints:
          - node.hostname == MiniTwit-Database

volumes:
  db_data_prod:

networks:
  minitwit-public:
    external: true
  # Private network — only backend and db, not exposed to Traefik
  backend-db:
    driver: overlay
