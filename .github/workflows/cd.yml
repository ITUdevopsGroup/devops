name: cd

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for all workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA=${{ github.event.workflow_run.head_sha || github.sha }}
          TIMEOUT=600
          ELAPSED=0


          echo SHA=$SHA
          
          while true; do
            if [ "$ELAPSED" -ge "$TIMEOUT" ]; then
              echo "Timed out, proceeding anyway."
              break
            fi
            
            RUNNING=$(gh run list --repo ${{ github.repository }} \
            --branch main \
            --json headSha,status,databaseId \
            --jq "[.[] | select(.headSha == \"$SHA\" and .databaseId != ${{ github.run_id }} and (.status == \"in_progress\" or .status == \"queued\"))] | length")
            
            if [ "$RUNNING" = "0" ]; then
              echo "All workflows for $SHA completed."
              break
            fi
            
            echo "$RUNNING workflow(s) still running, waiting 15s..."
            sleep 15
            ELAPSED=$((ELAPSED + 15))
          done

      - name: Update swarm
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: 167.172.111.97
          username: root
          key: ${{ secrets.SSH_KEY_FOR_DEPLOYMENT }}
          port: 22
          script: |
            cd /root/devops
            git pull
            docker stack deploy --compose-file swarm/proxy-stack.yml proxy --resolve-image always
            docker stack deploy --compose-file swarm/app-stack.yml app --resolve-image always
            docker stack deploy --compose-file swarm/docker-swarm-ui.yml swarm --resolve-image always
            docker stack deploy --compose-file swarm/monitoring-stack.yml monitoring --resolve-image always


            