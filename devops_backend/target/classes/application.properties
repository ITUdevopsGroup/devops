spring.application.name=itu_minitwit
server.port=5001

spring.datasource.url=${MINITWIT_DB_URL:jdbc:postgresql://167.172.111.97:5432/minitwit}
spring.datasource.username=${MINITWIT_DB_USER:minitwit_user}
spring.datasource.password=${MINITWIT_DB_PASSWORD:minitwit_password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.sql.init.mode=never

# Expose prometheus metrics endpoint
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always
# Enable histogram buckets for response time percentiles (p50, p99)
management.metrics.distribution.percentiles-histogram.http.server.requests=true


logging.level.root=INFO
logging.level.com.yourapp=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%logger{36}] %msg%n