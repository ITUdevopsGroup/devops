global:
  scrape_interval: 15s

scrape_configs:

  # Your Spring Boot app
  - job_name: 'minitwit-app'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['backend:5001']

  # Server infrastructure (CPU, RAM, disk)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
